services:
  - type: web
    name: civicshield-backend
    runtime: python
    plan: starter  # 512MB RAM -- see DEPLOYMENT.md before choosing this
    region: singapore  # closest Render region to India as of writing; check current options
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicshield-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false  # set this manually in the Render dashboard — never commit a real key here
      - key: CORS_ORIGINS
        value: "*"  # set to your deployed frontend URL(s) once known
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: civicshield-db
    plan: free  # expires after 30 days -- fine for a hackathon, see DEPLOYMENT.md
    region: singapore
